<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>
/* Sin el nombre del bar en el enlace (?bar=…) no se abre ninguna carta: se va a la página de MultiBar ("escanea el QR de tu mesa"). */
(function(){ try { var b = (new URLSearchParams(location.search).get('bar') || '').trim().toLowerCase();
  if(!/^[a-z0-9][a-z0-9-]{1,39}$/.test(b)) location.replace('../'); } catch(e) {} })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#22262E" data-bar>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carta" data-bar>

<!-- Aspecto del bar (colores, fuentes, logo, icono y textos): sale de sus
     ajustes en la base (ver comun/aspecto.js). Se pinta ya con lo que se
     recordó la última vez; si es la primera, la carta espera a saberlo
     para no enseñar un momento colores que no son del bar. El icono y el
     nombre para instalar la carta en el móvil también son de cada bar. -->
<script src="../comun/aspecto.js"></script>
<script>
(function(){
  var info = null;
  try { var b = (new URLSearchParams(location.search).get('bar') || '').trim().toLowerCase(); info = JSON.parse(localStorage.getItem('bar.' + b)); } catch(e) {}
  if(info && info.nombre && info._v === 2) Aspecto.aplicar(info, { instalable: true }); else Aspecto.esperar();
})();
</script>

<title>Carta digital</title>
<link rel="stylesheet" href="../comun/estilos.css">
<link rel="stylesheet" href="carta.css">
</head>
<body>

<div class="paper">
  <div class="sticky-top">
    <div class="ticket-head">
      <!-- Nombre y subtítulo del bar: los pone carta.js con lo que dice la base -->
      <img class="bar-logo" id="barLogo" data-logo-bar alt="" hidden>
      <div class="store" id="barNombre" data-nombre-bar>&nbsp;</div>
      <div class="head-extra">
        <p class="hero-line">&nbsp;</p>
      </div>
    </div>

    <div class="cat-tabs-wrap">
      <div class="cat-tabs" id="catTabs"></div>
    </div>
  </div>

  <div id="menu"></div>

  <footer>
    <!-- Líneas del pie de cada bar (ajustes.pie en la base) -->
    <div id="barPie"></div>
    <div class="legal-enlace" id="legalEnlace" hidden><a id="legalLink" href="../legal/">Aviso legal y privacidad</a></div>
    <div class="version">Carta v12</div>
    <div class="firma">Carta digital por <a href="https://www.autonomialab.es" target="_blank" rel="noopener">autonomIA Lab</a></div>
  </footer>
</div>

<div class="photo-modal" id="photoModal"><div class="photo-card" id="photoCard"></div></div>

<div class="fixed-bottom">
  <button class="top-send" id="bottomSendBtn">Enviar pedido a barra</button>
  <div class="dock">
    <div class="dock-inner">
      <div>
        <div class="lbl" id="cartCountLbl">0 líneas</div>
        <div class="amt" id="cartTotalLbl">0,00€</div>
      </div>
      <button class="cta" id="openCartBtn">VER TIQUE</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="panel" id="panel">
  <div class="panel-head">
    <h2 id="txtTuTique">TU TIQUE</h2>
    <button class="panel-close" id="closePanelBtn">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot">
    <div class="barcode"></div>
    <div class="total-row"><span id="txtTotal">TOTAL CUENTA</span><span class="amt" id="panelTotal">0,00 €</span></div>
    <button class="send-btn" id="sendBtn">ENVIAR PEDIDO A BARRA</button>
    <p class="note">El pago se hace en la barra, al recoger o al terminar la fiesta.</p>
    <p class="pie-tique" id="pieTique"></p>
  </div>
</div>

<div class="confirm" id="confirm">
  <div class="confirm-card">
    <div class="stamp-mark">PEDIDO ENVIADO</div>
    <p id="confirmText">Va para la barra. Pide otra ronda cuando quieras.</p>
    <button id="confirmClose">Vale</button>
  </div>
</div>

<script src="../comun/datos.js"></script>
<script src="carta.js"></script>
</body>
</html>
