<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Mar de Gambas · Cervecerías</title>
<meta name="description" content="La Mar de Gambas Cervecerías, Sevilla, desde 2007.">
<meta name="theme-color" content="#14295E">
<style>
  /* Página provisional. Colores del local: azul marino y naranja. */
  :root{
    --azul:#14295E;
    --azul-oscuro:#0E1F4D;
    --naranja:#F08A3E;
    --blanco:#FFFFFF;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:24px 16px;
    background:var(--azul-oscuro);
    background:linear-gradient(180deg, var(--azul) 0%, var(--azul-oscuro) 100%);
    color:var(--blanco);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align:center;
    -webkit-text-size-adjust:100%;
  }
  h1{
    font-size:clamp(2.2rem, 11vw, 4rem);
    font-weight:800;
    line-height:1.05;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .sub{
    margin-top:10px;
    color:var(--naranja);
    font-size:1rem;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  .boton{
    display:inline-block;
    padding:16px 36px;
    border-radius:999px;
    background:var(--naranja);
    color:var(--blanco);
    font-size:1.15rem;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
  }
  .boton:active{ transform:scale(.97); }
</style>
</head>
<body>
  <header>
    <h1>La Mar<br>de Gambas</h1>
    <p class="sub">Cervecerías · Desde 2007</p>
  </header>
  <a class="boton" href="carta/">Ver la carta</a>
</body>
</html>
