<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16181D">
<title>MultiBar</title>
<!-- Página de la plataforma: sale en la dirección principal
     (carta.autonomialab.es) y cuando un enlace llega sin el nombre del bar
     (?bar=…). No enseña ningún bar. La antigua portada de La Mar de Gambas
     está en archivo/portada-lamardegambas.html. -->
<link rel="stylesheet" href="comun/estilos.css">
<style>
  /* Una sola pantalla centrada: marca arriba, mensaje grande, firma abajo */
  :root{
    --fondo:#16181D; --tinta:#F4F1EA; --suave:#A7A9B0; --acento:#F08A3E; --linea:rgba(244,241,234,.14);
  }
  html, body{ height:100%; }
  body{ margin:0; background:var(--fondo); color:var(--tinta); font-family:var(--font-texto);
        display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  .marca{ padding:calc(28px + env(safe-area-inset-top, 0px)) 16px 0; text-align:center;
          font-family:var(--font-titulos); font-weight:700; font-size:20px; letter-spacing:.32em; padding-left:calc(16px + .32em); }
  .marca span{ color:var(--acento); }
  main{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
        padding:24px 16px; text-align:center; }
  .qr{ width:112px; height:112px; color:var(--acento); }
  h1{ font-family:var(--font-titulos); font-weight:700; text-transform:uppercase; letter-spacing:.03em;
      font-size:clamp(30px, 8.5vw, 46px); line-height:1.12; margin:0; max-width:15ch; text-wrap:balance; }
  p.ayuda{ color:var(--suave); font-size:16px; line-height:1.55; margin:0; max-width:32ch; }
  footer{ border-top:1px solid var(--linea); padding:18px 16px calc(22px + env(safe-area-inset-bottom, 0px));
          text-align:center; color:var(--suave); font-size:13px; line-height:1.6; }
  footer a{ display:inline-block; padding:4px 8px; color:inherit; text-decoration:none; }
  footer b{ color:var(--tinta); font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  footer a:focus-visible{ outline:2px solid var(--acento); outline-offset:3px; }
</style>
</head>
<body>
  <div class="marca">MULTI<span>BAR</span></div>
  <main>
    <svg class="qr" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" aria-hidden="true">
      <rect x="6" y="6" width="20" height="20" rx="3"/><rect x="38" y="6" width="20" height="20" rx="3"/><rect x="6" y="38" width="20" height="20" rx="3"/>
      <rect x="13" y="13" width="6" height="6" fill="currentColor" stroke="none"/><rect x="45" y="13" width="6" height="6" fill="currentColor" stroke="none"/><rect x="13" y="45" width="6" height="6" fill="currentColor" stroke="none"/>
      <path d="M38 38h8v8M58 38v20H46M38 52v6" stroke-linecap="round"/>
    </svg>
    <h1>Para ver la carta y pedir, escanea el código QR de tu mesa</h1>
    <p class="ayuda">Lo encontrarás en la mesa. Si no lo ves o no funciona, pide ayuda al personal del local.</p>
  </main>
  <footer>
    <a href="https://www.autonomialab.es" target="_blank" rel="noopener">MultiBar · Cartas digitales y pedidos para bares<br>
    de <b>autonomIA Lab</b></a>
  </footer>
</body>
</html>
